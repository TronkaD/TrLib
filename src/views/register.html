<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'inscription</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../../dist/bundle.js" defer></script>
</head>
<body>
    <div class="form-container h-75 d-flex flex-column justify-content-center">
        <div class="text-center mb-4">
            <img src="../images/logo.png" alt="Logo de l'application" class="img-fluid" style="max-width: 25%;">
        </div>
        <form id="signup-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Entrez votre email" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" class="form-control" id="password" placeholder="Entrez votre mot de passe" required>
            </div>
            <div class="text-center">
                <button class="btn btn-primary" type="submit">S'inscrire</button> 
            </div>
            <div class="text-center mt-3" onclick="changeView('login')">
                Déjà un compte ? connectez-vous !
            </div>
        </form>
        <div class="alert alert-danger mt-3">
            <strong>Danger!</strong> Indicates a dangerous or potentially negative action.
        </div>
    </div>
</body>
</html>
