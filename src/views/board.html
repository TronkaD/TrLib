<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application TrLib</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="../../dist/bundle.js" defer></script>
</head>

<body id="body-board">
  <nav class="navbar navbar-expand-sm bg-white border border-success">
    <div class="container-fluid">
      <a class="navbar-brand text-white bg-success px-3" href="javascript:void(0)">TrLib</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div>
        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal">Ajouter Un Livre</button>
        <button type="button" class="btn btn-danger" id="logout-btn">Deconnexion</button>
      </div>
    </div>
  </nav>
  <div class="container-fluid mt-5 w-75">
    <h4>Inventaires Livres</h4>
    <div class="input-group mb-3">
      <label class="input-group-text" for="inputGroupSelect01">Options</label>
      <select class="form-select form-control" id="inputGroupSelect01">
        <option selected>Tous les livres</option>
        <option value="disponible">disponible</option>
        <option value="emprunter">emprunter</option>
      </select>
    </div>
    <div class="input-group">
      <input type="text" class="form-control" id="searchInput" placeholder="Rechercher par Titre, Autheur, ISBN">
      <div class="input-group-append">
        <button class="btn btn-success" type="button" id="button-search" style="margin:0px;">Recherche</button>
      </div>
    </div>
    <table class="table" id="dataTable">
      <thead>
        <tr>
          <th scope="col">Titre</th>
          <th scope="col">Auteur</th>
          <th scope="col">Date publication</th>
          <th scope="col">ISBN</th>
          <th scope="col">Statut</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody id ="table-body">
        <!-- Les livres ajoutés apparaîtront ici -->
      </tbody>
    </table>
    <ul class="pagination">
      <li class="page-item"><button class="page-link text-success" id="prevButton">Précédent</button></li>
      <li class="page-item"><button class="page-link text-success" id="nextButton">Suivant</button></li>
    </ul> 
  </div>

  <!-- Modal add book -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Enregistrer un livre</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="add-book-form">
            <div class="form-group">
              <label for="author">Auteur</label>
              <input type="text" class="form-control" id="author" required>
            </div>
            <div class="form-group">
              <label for="title">Titre du livre</label>
              <input type="text" class="form-control" id="title" required>
            </div>
            <div class="form-group">
              <label for="image">Image</label>
              <input type="file" class="form-control" id="image" required>
            </div>
            <div class="form-group">
              <label for="isbn">ISBN</label>
              <input type="text" class="form-control" id="isbn" required>
            </div>
            <div class="form-group">
              <label for="dateOfPublication">Date de publication</label>
              <input type="date" class="form-control" id="dateOfPublication" required>
            </div>
            <div class="form-group">
              <label for="status">Statut</label>
              <select class="form-control" id="status" required>
                <option value="disponible">disponible</option>
                <option value="emprunter">emprunter</option>
              </select>
            </div>
            <div class="form-group d-flex justify-content-center gap-3">
              <button type="reset" class="btn btn-secondary px-3" data-bs-dismiss="modal">Annuler</button>
              <button class="btn btn-success text-white px-3" type="submit">Valider</button> 
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- The Modal -->
<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title-booked"></h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
        <form id="book-reservation-form">
          <div class="form-group">
            <label for="email">Email de emprunteur</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="form-group">
            <label for="dateBooked">Date de l'emprunt</label>
            <input type="datetime-local" class="form-control" id="dateBooked" required>
          </div>
        </form>
      </div>
      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-success" data-bs-dismiss="modal">Reserver</button>
      </div>
    </div>
  </div>
</div>
</body>

</html>
