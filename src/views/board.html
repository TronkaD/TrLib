<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application TrLib</title>
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../dist/bundle.js"></script>
</head>

<body id="body-board">
  <nav class="navbar navbar-expand-sm bg-white border border-success">
    <div class="container-fluid">
      <a class="navbar-brand text-white bg-success px-3" href="javascript:void(0)">TrLib</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div>
        
      </div>
      <div>
        <button  type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal"> Ajouter Un Livre</button>
        <button  type="button" class="btn btn-danger" id="logout-btn">Deconnexion</button>
      </div>
    </div>
  </nav>
  <div class="container-fluid mt-5 w-75">
    <h4>Inventaires Livres</h4>
    <div class="input-group mb-3">
      <label class="input-group-text" for="inputGroupSelect01">Options</label>
      <select class="form-select" id="inputGroupSelect01">
        <option selected>Tous les livres</option>
        <option value="1">One</option>
        <option value="2">Two</option>
      </select>
    </div>
    <div class="input-group">
      <input type="text" class="form-control" placeholder="Rechercher par Titre, Autheur, ISBN">
      <div class="input-group-append">
        <button class="btn btn-success" type="button" style="margin:0px;">Recherche</button>
      </div>
    </div>
    <table class="table">
      <thead>
        <tr>
          <th scope="col">N°</th>
          <th scope="col">Titre</th>
          <th scope="col">Autheur</th>
          <th scope="col">Date publication</th>
          <th scope="col">ISBN</th>
          <th scope="col">Statuts</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">1</th>
          <td>Journal</td>
          <td>Anne Franck</td>
          <td>05/02/1998</td>
          <td>119178</td>
          <td>available</td>
          <td>
            <button class="btn btn-success">Book</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

<!-- Modal add book -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Enregistrer un livre</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="add-book-form">
          <div class="form-group">
              <label for="title">Titre du livre</label>
              <input type="text" class="form-control" id="title" placeholder="" required>
          </div>
          <div class="form-group">
            <label for="auther">Auteur</label>
            <input type="text" class="form-control" id="auther" placeholder="" required>
          </div>
          <div class="form-group">
            <label for="dateOfPublication">Date de publication</label>
            <input type="text" class="form-control" id="dateOfPublication" placeholder="" required>
          </div>
          <div class="form-group">
            <label for="code">ISBN</label>
            <input type="text" class="form-control" id="code" placeholder="" required>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <input type="text" class="form-control" id="status" placeholder="" required>
          </div>
      </form>
      </div>
      <div class="modal-footer">
        <button type="reset" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-success">Valider</button>
      </div>
    </div>
  </div>
</div>
<!-- Modal add book -->
</body>
</html>
